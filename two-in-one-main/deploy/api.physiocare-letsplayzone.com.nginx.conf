# =============================================================================
# nginx site config for the two-in-one API backend
# Target: https://api.physiocare-letsplayzone.com  ->  Node app on 127.0.0.1:5001
#
# Install (Ubuntu/Debian VPS with nginx):
#   1. Copy this file to /etc/nginx/sites-available/api.physiocare-letsplayzone.com
#   2. ln -s /etc/nginx/sites-available/api.physiocare-letsplayzone.com \
#            /etc/nginx/sites-enabled/api.physiocare-letsplayzone.com
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d api.physiocare-letsplayzone.com
#      (certbot rewrites the server block below to point the ssl_certificate
#       lines at the real Let's Encrypt files, so no manual cert editing needed)
#
# The Node backend serves both the JSON API (/api/...) AND the uploaded files
# (/uploads/...), so everything is proxied to it.
# =============================================================================

# --- HTTP -> HTTPS redirect ------------------------------------------------
server {
    listen 80;
    server_name api.physiocare-letsplayzone.com;
    return 301 https://$host$request_uri;
}

# --- HTTPS site -------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.physiocare-letsplayzone.com;

    # certbot --nginx replaces these two lines with the real certificate paths.
    # (If you provision TLS some other way, point these at your certificate.)
    ssl_certificate     /etc/letsencrypt/live/api.physiocare-letsplayzone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.physiocare-letsplayzone.com/privkey.pem;

    # Admin panel uploads images AND videos (mp4) -> allow larger bodies.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
